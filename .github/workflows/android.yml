name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: apk (${{ matrix.abi }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # The ubuntu-24.04 runner image already ships the Android SDK and NDK.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.target }}
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set: signing with a throwaway key. Updates will NOT install over a previous build; uninstall first."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass tvhme-ci -keypass tvhme-ci -alias tvhme -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=TVHme CI"
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=tvhme-ci" >> "$GITHUB_ENV"
          fi
          echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          cargo apk build --release -p tvhme-app --lib --target ${{ matrix.target }}
      - name: Collect APK
        run: |
          mkdir -p dist
          cp target/release/apk/TVHme.apk "dist/TVHme-${{ matrix.abi }}.apk"
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: tvhme-android-${{ matrix.abi }}
          path: dist/*.apk
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk

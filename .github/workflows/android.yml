name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The ubuntu-24.04 runner image already ships the Android SDK and NDK
      # (ANDROID_HOME, ANDROID_NDK_LATEST_HOME), so no SDK setup action is needed.
      - name: Show Android toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK=$ANDROID_NDK_LATEST_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/ndk"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Build debug APK
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          cargo apk build -p tvhme-app --lib
      - name: Collect APK
        run: |
          mkdir -p dist
          find target -name '*.apk' -exec cp {} dist/ \;
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: tvhme-android-apk
          path: dist/*.apk
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk

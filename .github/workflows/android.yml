name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: apk (${{ matrix.abi }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # The ubuntu-24.04 runner image already ships the Android SDK and NDK.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.target }}
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/release.jks" \
              || { echo "::error::The keystore secret is not valid base64. Re-create it from: base64 -w0 tvhme.jks"; exit 1; }
            keytool -list ${KEY_ALIAS:+-alias "$KEY_ALIAS"} -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASS" >/dev/null \
              || { echo "::error::Keystore could not be opened: wrong password, wrong alias or wrong file."; exit 1; }
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret set: signing with a throwaway key. Updates will NOT install over a previous build; uninstall first."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass tvhme-ci -keypass tvhme-ci -alias tvhme -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=TVHme CI"
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=tvhme-ci" >> "$GITHUB_ENV"
          fi
          echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          # Skia's build downloads its sources from googlesource.com, which sometimes answers 429 (too many
          # requests) to shared CI machines. That says nothing about our code, so wait and try again.
          for attempt in 1 2 3 4; do
            if cargo apk build --release -p tvhme-app --lib --target ${{ matrix.target }}; then exit 0; fi
            echo "::warning::build attempt $attempt failed, retrying after a pause"
            sleep $((attempt * 120))
          done
          exit 1
      - name: Collect APK
        run: |
          mkdir -p dist
          cp target/release/apk/TVHme.apk "dist/TVHme-${{ matrix.abi }}.apk"
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: tvhme-android-${{ matrix.abi }}
          path: dist/*.apk
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk

name: Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            appimage_arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
            appimage_arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libgl1-mesa-dev file
      - name: Test core and mock
        run: cargo test -p tvhme-core -p tvhme-mock -p tvhme-app
      - name: Build app
        run: cargo build --release -p tvhme-app --bin tvhme
      - name: Package tar.gz
        run: |
          mkdir -p dist
          cp target/release/tvhme dist/tvhme
          cp assets/icon.svg dist/tvhme.svg
          mkdir -p dist/icons && cp assets/icons/*.png dist/icons/
          cp packaging/linux/tvhme.desktop packaging/linux/install.sh dist/
          tar czf tvhme-linux-${{ matrix.arch }}.tar.gz -C dist .
      - name: Package AppImage
        env:
          ARCH: ${{ matrix.appimage_arch }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          rm -rf AppDir && mkdir -p AppDir/usr/bin
          cp target/release/tvhme AppDir/usr/bin/tvhme
          cp packaging/linux/tvhme.desktop AppDir/tvhme.desktop
          cp assets/icons/512x512.png AppDir/tvhme.png
          cp AppDir/tvhme.png AppDir/.DirIcon
          for s in 16 24 32 48 64 128 256 512; do
            mkdir -p AppDir/usr/share/icons/hicolor/${s}x${s}/apps && cp assets/icons/${s}x${s}.png AppDir/usr/share/icons/hicolor/${s}x${s}/apps/tvhme.png
          done
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps && cp assets/icon.svg AppDir/usr/share/icons/hicolor/scalable/apps/tvhme.svg
          ln -s usr/bin/tvhme AppDir/AppRun
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimage_arch }}.AppImage"
          chmod +x appimagetool
          ./appimagetool AppDir "TVHme-${{ matrix.appimage_arch }}.AppImage"
          ls -la *.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: tvhme-linux-${{ matrix.arch }}
          path: |
            tvhme-linux-${{ matrix.arch }}.tar.gz
            TVHme-${{ matrix.appimage_arch }}.AppImage
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            tvhme-linux-${{ matrix.arch }}.tar.gz
            TVHme-${{ matrix.appimage_arch }}.AppImage

  # RISC-V has no GitHub-hosted runner. This uses the free RISE runners, which need the
  # "RISE RISC-V Runners" GitHub App installed on the repository (see README).
  # It is slow (a native RISC-V build takes a long time), so it only runs when started by hand
  # (Actions > Linux > Run workflow).
  build-riscv64:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          key: riscv64
      - name: Rust toolchain
        run: |
          command -v rustup >/dev/null && rustup update stable --no-self-update || true
          cargo --version
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libgl1-mesa-dev file
      - name: Test core and mock
        run: cargo test -p tvhme-core -p tvhme-mock -p tvhme-app
      - name: Build app
        run: cargo build --release -p tvhme-app --bin tvhme
      - name: Package tar.gz
        run: |
          mkdir -p dist/icons
          cp target/release/tvhme dist/tvhme
          cp assets/icon.svg dist/tvhme.svg
          cp assets/icons/*.png dist/icons/
          cp packaging/linux/tvhme.desktop packaging/linux/install.sh dist/
          tar czf tvhme-linux-riscv64.tar.gz -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: tvhme-linux-riscv64
          path: tvhme-linux-riscv64.tar.gz
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: tvhme-linux-riscv64.tar.gz

  # Fedora packages, built inside a Fedora 44 container on native amd64 and arm64 runners.
  # (A package built on Fedora 44 installs on 44 and later.)
  rpm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    container: fedora:44
    steps:
      - name: Tools and libraries
        run: |
          dnf -y install git rust cargo gcc gcc-c++ rpm-build fontconfig-devel libxkbcommon-devel libxkbcommon-x11-devel wayland-devel libxcb-devel mesa-libGL-devel file
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          key: fedora44-${{ matrix.arch }}
      - name: Build app
        run: cargo build --release -p tvhme-app --bin tvhme
      - name: Build RPM
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" --define "srcroot $PWD" --define "pkgversion $VERSION" packaging/linux/tvhme.spec
          mkdir -p dist-rpm && cp rpmbuild/RPMS/*/*.rpm dist-rpm/
          ls -la dist-rpm
      - uses: actions/upload-artifact@v7
        with:
          name: tvhme-rpm-${{ matrix.arch }}
          path: dist-rpm/*.rpm
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist-rpm/*.rpm

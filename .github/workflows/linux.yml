name: Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc requirement low so the binary runs on older distros too.
          - os: ubuntu-22.04
            arch: amd64
            appimage_arch: x86_64
          - os: ubuntu-22.04-arm
            arch: arm64
            appimage_arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libgl1-mesa-dev librsvg2-bin file
      - name: Test core and mock
        run: cargo test -p tvhme-core -p tvhme-mock -p tvhme-app
      - name: Build app
        run: cargo build --release -p tvhme-app --bin tvhme
      - name: Package tar.gz
        run: |
          mkdir -p dist
          cp target/release/tvhme dist/tvhme
          cp assets/icon.svg dist/tvhme.svg
          cp packaging/linux/tvhme.desktop dist/
          tar czf tvhme-linux-${{ matrix.arch }}.tar.gz -C dist .
      - name: Package AppImage
        env:
          ARCH: ${{ matrix.appimage_arch }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          rm -rf AppDir && mkdir -p AppDir/usr/bin
          cp target/release/tvhme AppDir/usr/bin/tvhme
          cp packaging/linux/tvhme.desktop AppDir/tvhme.desktop
          rsvg-convert -w 512 -h 512 assets/icon.svg -o AppDir/tvhme.png
          ln -s usr/bin/tvhme AppDir/AppRun
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimage_arch }}.AppImage"
          chmod +x appimagetool
          ./appimagetool AppDir "TVHme-${{ matrix.appimage_arch }}.AppImage"
          ls -la *.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: tvhme-linux-${{ matrix.arch }}
          path: |
            tvhme-linux-${{ matrix.arch }}.tar.gz
            TVHme-${{ matrix.appimage_arch }}.AppImage
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tvhme-linux-${{ matrix.arch }}.tar.gz
            TVHme-${{ matrix.appimage_arch }}.AppImage

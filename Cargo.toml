[workspace]
resolver = "2"
members = ["crates/tvhme-core", "crates/tvhme-mock", "crates/tvhme-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/mmBesar/TVHme"

[workspace.dependencies]
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time", "signal"] }
sha1 = "0.10"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

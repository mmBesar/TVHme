[package]
name = "tvhme-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "tvhme"
path = "src/main.rs"

[dependencies]
tvhme-core = { path = "../tvhme-core" }
tokio = { workspace = true, features = ["process", "sync", "macros", "time", "rt-multi-thread"] }
slint = "1.18"
serde = { workspace = true }
serde_json = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
slint = { version = "1.18", features = ["backend-android-activity-06"] }

[build-dependencies]
slint-build = "1.18"

[package.metadata.android]
package = "io.github.mmbesar.tvhme"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
apk_name = "TVHme"
# Launcher icon: PNGs for every screen density plus an adaptive icon (see android/res).
resources = "../../android/res"

[package.metadata.android.application]
# Home servers are often plain http on the LAN; Android blocks that unless the app says it may.
uses_cleartext_traffic = true
icon = "@mipmap/ic_launcher"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
